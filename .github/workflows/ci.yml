name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/clang-module-cache
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/swiftpm-module-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare writable module caches
        run: mkdir -p "$CLANG_MODULE_CACHE_PATH" "$SWIFTPM_MODULECACHE_OVERRIDE"

      - name: Run Swift tests
        run: swift test

      - name: Check release build scripts
        run: zsh Tests/Scripts/build-scripts-test.sh

      - name: Check public repository policy
        run: zsh Tests/Scripts/repository-policy-test.sh
