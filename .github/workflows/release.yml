name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare writable module caches
        run: |
          echo "CLANG_MODULE_CACHE_PATH=$RUNNER_TEMP/clang-module-cache" >> "$GITHUB_ENV"
          echo "SWIFTPM_MODULECACHE_OVERRIDE=$RUNNER_TEMP/swiftpm-module-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/clang-module-cache" "$RUNNER_TEMP/swiftpm-module-cache"

      - name: Run Swift tests
        run: swift test

      - name: Check release build scripts
        run: zsh Tests/Scripts/build-scripts-test.sh

      - name: Check public repository policy
        run: zsh Tests/Scripts/repository-policy-test.sh

      - name: Build and verify tagged release
        shell: zsh {0}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" == v* ]] || { print -u2 -- "release tag must start with v"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ '^[0-9]+(\.[0-9]+){0,2}$' ]] || { print -u2 -- "invalid release version: $version"; exit 1; }
          [[ "$tag" == "v$version" ]] || { print -u2 -- "release tag was not normalized: $tag"; exit 1; }
          zsh scripts/build-dmg.sh "$version"
          zsh scripts/verify-release.sh "dist/Codex Quota.app"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.sha256

  windows-release:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Windows quota core tests
        run: dotnet run --project windows/CodexQuota.Windows.Tests/CodexQuota.Windows.Tests.csproj --configuration Release -- Tests/Fixtures

      - name: Build tagged Windows release
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith('v')) { throw 'release tag must start with v' }
          $version = $tag.Substring(1)
          if ($version -notmatch '^[0-9]+(\.[0-9]+){0,2}$') { throw "invalid release version: $version" }
          if ($tag -ne "v$version") { throw "release tag was not normalized: $tag" }
          pwsh -File scripts/build-windows.ps1 -Version $version

      - name: Publish Windows assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.sha256
