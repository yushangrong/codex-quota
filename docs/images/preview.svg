<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Codex Quota 界面预览</title>
  <desc id="description">原创矢量示意图，展示 Codex Quota 额度胶囊位于官方 Codex 窗口左下角头像右侧；不是运行截图。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161a23"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232936"/>
      <stop offset="1" stop-color="#171c26"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#183f31"/>
      <stop offset="1" stop-color="#102d25"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#background)"/>
  <circle cx="1020" cy="120" r="220" fill="#2dd4bf" opacity="0.06"/>
  <circle cx="150" cy="650" r="260" fill="#60a5fa" opacity="0.05"/>

  <text x="86" y="72" fill="#f2f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="700">界面预览</text>
  <text x="86" y="106" fill="#8f9aaa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16">原创矢量示意 · 非运行截图 · 不含 OpenAI 标志图形</text>

  <g filter="url(#shadow)">
    <rect x="84" y="142" width="1032" height="500" rx="20" fill="#10141c" stroke="#3a4352"/>
    <path d="M84 162a20 20 0 0 1 20-20h992a20 20 0 0 1 20 20v38H84z" fill="#1e2430"/>
    <circle cx="116" cy="171" r="6" fill="#ff6b6b"/>
    <circle cx="138" cy="171" r="6" fill="#f7c85e"/>
    <circle cx="160" cy="171" r="6" fill="#5bca7a"/>
    <text x="600" y="177" text-anchor="middle" fill="#aeb7c5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">官方 Codex 窗口（位置示意）</text>

    <rect x="84" y="200" width="318" height="442" fill="url(#panel)"/>
    <rect x="402" y="200" width="714" height="442" fill="#121720"/>
    <line x1="402" y1="200" x2="402" y2="642" stroke="#343c49"/>

    <rect x="112" y="228" width="164" height="16" rx="8" fill="#5f6978" opacity="0.7"/>
    <rect x="112" y="270" width="252" height="42" rx="10" fill="#2b3341"/>
    <circle cx="134" cy="291" r="8" fill="#7d899a"/>
    <rect x="154" y="284" width="132" height="13" rx="6" fill="#8792a2" opacity="0.72"/>
    <rect x="112" y="328" width="220" height="12" rx="6" fill="#586273" opacity="0.65"/>
    <rect x="112" y="358" width="188" height="12" rx="6" fill="#586273" opacity="0.48"/>
    <rect x="112" y="388" width="236" height="12" rx="6" fill="#586273" opacity="0.4"/>

    <rect x="456" y="252" width="242" height="18" rx="9" fill="#6c7787" opacity="0.56"/>
    <rect x="456" y="294" width="588" height="12" rx="6" fill="#525d6e" opacity="0.36"/>
    <rect x="456" y="322" width="520" height="12" rx="6" fill="#525d6e" opacity="0.3"/>
    <rect x="456" y="350" width="566" height="12" rx="6" fill="#525d6e" opacity="0.25"/>
    <rect x="456" y="414" width="610" height="116" rx="16" fill="#171e29" stroke="#2e3745"/>

    <line x1="104" y1="568" x2="382" y2="568" stroke="#3c4554"/>
    <circle cx="134" cy="605" r="17" fill="#697587"/>
    <circle cx="134" cy="600" r="6" fill="#bec6d1"/>
    <path d="M123 614c3-7 19-7 22 0" fill="none" stroke="#bec6d1" stroke-width="3" stroke-linecap="round"/>

    <g>
      <rect x="164" y="584" width="210" height="42" rx="21" fill="url(#pill)" stroke="#58c99c" stroke-opacity="0.6"/>
      <path d="M180 590h176" stroke="#c7ffe8" stroke-opacity="0.16" stroke-linecap="round"/>
      <circle cx="185" cy="605" r="5" fill="#5ee0aa"/>
      <text x="199" y="611" fill="#e6fff5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600">Codex 63% · 3天后重置</text>
    </g>
  </g>

  <path d="M378 604C470 604 470 672 568 672" fill="none" stroke="#5ee0aa" stroke-width="2" stroke-dasharray="5 7" opacity="0.8"/>
  <circle cx="378" cy="604" r="4" fill="#5ee0aa"/>
  <text x="586" y="678" fill="#b9c4d2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">额度胶囊贴合在左下角头像右侧</text>
</svg>
